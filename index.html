function studentTable(){return `<div class="panel table-panel"><div class="panel-head"><div><h3>Student register</h3><div class="subtle">Recently added and active student records</div></div><button class="link-btn" data-nav="Students">View all students →</button></div>${studentTableBody(state.students.slice(0,5))}</div>`}

function childPanel(){const child=currentChild()||state.students[0];const hw=state.homework.filter(h=>h.klass===child.klass&&!h.submittedBy.includes(child.id));const notice=state.notices[0];return `<div class="grid panels"><div class="panel"><div class="panel-head"><h3>Next assignment</h3>${statusBadge(hw.length?'Due soon':'All submitted')}</div>${hw.length?`<b style="font-size:11px">${esc(hw[0].subject)} · ${esc(hw[0].title)}</b><p class="subtle">${esc(hw[0].description)}</p><button class="secondary" data-nav="Homework">View homework</button>`:'<p class="subtle">No pending homework for this child.</p>'}</div><div class="panel"><div class="panel-head"><h3>School notice</h3><span class="subtle">${notice?dateFmt(notice.date):''}</span></div>${notice?`<b style="font-size:11px">${esc(notice.title)}</b><p class="subtle">${esc(notice.body)}</p>`:'<p class="subtle">No notices yet.</p>'}<button class="link-btn" data-nav="Notices">Read notices →</button></div></div>`}
function platformPanel(){return `<div class="panel table-panel"><div class="panel-head"><div><h3>School portfolio</h3><div class="subtle">Sample tenant overview</div></div><button class="link-btn" data-nav="Schools">Manage schools →</button></div><div class="table-wrap"><table><thead><tr><th>School</th><th>Plan</th><th>Students</th><th>Renewal</th><th>Status</th></tr></thead><tbody>${state.schools.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.plan)}</td><td>${s.students.toLocaleString('en-IN')}</td><td>${dateFmt(s.renewal)}</td><td>${statusBadge(s.status)}</td></tr>`).join('')}</tbody></table></div></div>`}
function statusBadge(v){let s=String(v||'');let cls=/present|paid|active|published|completed|available|submitted/i.test(s)?'paid':/absent|failed|overdue|inactive/i.test(s)?'absent':/pending|due|scheduled|draft|upcoming|renewal|leave|open|progress/i.test(s)?'pending':'neutral-status';return `<span class="status ${cls}">${esc(s)}</span>`}
function toolbar(placeholder,buttons=''){return `<div class="page-tools"><input class="search" id="tableSearch" type="search" placeholder="${esc(placeholder)}" value="${esc(searchTerm)}">${buttons}</div>`}
function actionButtons(items){return `<div class="actions">${items.join('')}</div>`}
function btn(action,label,kind='secondary',extra=''){return `<button type="button" class="${kind}" data-action="${esc(action)}" ${extra}>${label}</button>`}
function panelTable(title,heads,rows,empty='No records found.'){return `<div class="panel table-panel"><div class="panel-head"><h3>${esc(title)}</h3><span class="subtle">${rows.length} records</span></div>${rows.length?`<div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="empty-state">${esc(empty)}</div>`}</div>`}
function renderPage(p){
 const descriptions={Schools:'Create and manage school tenants on the ZenX platform.',Subscriptions:'Review each school’s plan, limits and renewal date.',Payments:'Review subscription invoices and demo payment states.',Support:'Track school support requests and priorities.',Settings:'Manage demo workspace branding and preferences.',Students:'Maintain student admissions, profiles and fee balances.',Attendance:'Take the daily class register and review attendance.',Fees:'View student dues and record offline demo payments.',Classes:'Manage class sections and class teacher assignments.',Exams:'Schedule assessments and publish results.',Homework:'Create assignments and track student submissions.',Staff:'Manage teacher and staff records.',Transport:'Review school vehicles, routes and assigned students.',Library:'Review book inventory and issue status.',Reports:'Review school performance summaries and export sample data.', 'My Classes':'Your assigned classes and student groups.',Marks:'Enter marks for an assessment and preview grades.',Timetable:'Review today’s teacher timetable.',Leave:'Submit a sample leave request.', 'Exams & Results':'View the student examination calendar and published results.',Results:'Review your child’s published examination results.',Notices:'Read school circulars and announcements.'};
 const desc=descriptions[p]||'Review this module using sample demo records.';
 const actions=[];
 if(p==='Students')actions.push(btn('add-student','＋ Add student','primary'));
 if(p==='Schools')actions.push(btn('add-school','＋ Add school','primary'));

 if(p==='Fees'&&(role==='school'||role==='parent'))actions.push(btn('collect-fee','＋ Record payment','primary'));
 if(p==='Homework'&&(role==='school'||role==='teacher'))actions.push(btn('add-homework','＋ Create homework','primary'));
 if(p==='Exams'&&role==='school')actions.push(btn('add-exam','＋ Create exam','primary'));
 if(p==='Marks'&&role==='teacher')actions.push(btn('enter-marks','✎ Enter marks','primary'));
 if(p==='Notices'&&role==='school')actions.push(btn('add-notice','＋ Publish notice','primary'));
 if(p==='Staff'&&role==='school')actions.push(btn('add-staff','＋ Add staff','primary'));
 if(p==='Classes'&&role==='school')actions.push(btn('add-class','＋ Add class','primary'));
 if(p==='Leave'&&role==='teacher')actions.push(btn('apply-leave','＋ Apply for leave','primary'));
 if(p==='Support'&&role==='super')actions.push(btn('add-ticket','＋ Add ticket','primary'));
 if(p==='Settings'&&(role==='super'||role==='school')){}
 if(p==='Reports')actions.push(btn('export-report','↓ Export CSV','secondary'));
 if(['Students','Schools','Subscriptions','Payments','Support','Staff','Classes','Transport','Library','Homework','Notices','Exams','Results','Exams & Results'].includes(p))actions.push(btn('export-table','↓ Export CSV','secondary'));
 if(role==='school'&&['Students','Staff','Classes'].includes(p))actions.push(btn('import-csv','↑ Import CSV','secondary'));
 let table='';
 switch(p){
 case 'Schools':table=renderSchools();break;case 'Subscriptions':table=renderSubscriptions();break;case 'Payments':table=renderPayments();break;case 'Support':table=renderSupport();break;case 'Settings':return settingsPage();
 case 'Students':table=renderStudents();break;case 'Attendance':table=renderAttendance();break;case 'Fees':table=renderFees();break;case 'Classes':table=renderClasses();break;case 'Exams':table=renderExams();break;case 'Homework':table=renderHomework();break;case 'Staff':table=renderStaff();break;case 'Transport':table=renderTransport();break;case 'Library':table=renderLibrary();break;case 'Reports':return reportsPage();
 case 'My Classes':table=renderMyClasses();break;case 'Marks':table=renderMarks();break;case 'Timetable':table=renderTimetable();break;case 'Leave':table=renderLeave();break;
 case 'Exams & Results':case 'Results':table=renderChildResults();break;case 'Notices':table=renderNotices();break;
 default:table='<div class="panel empty-state">This module is not part of the interactive demo yet.</div>';
 }
 return `${pageHead(p,desc,toolbar('Search '+p.toLowerCase()+'...',actionButtons(actions)))}<div class="notice"><strong>Demo mode:</strong> Changes are stored in this browser only. No live school database, SMS, WhatsApp, GPS or payment gateway is connected.</div>${table}<div class="footer-note">ZenX School ERP · Interactive prototype · Sample data only</div>`;
}
function renderSchools(){return panelTable('Registered schools',['School','Plan','Students','Renewal','Status','Action'],state.schools.map(s=>`<tr><td><b>${esc(s.name)}</b><div class="subtle">${esc(s.id)}</div></td><td>${esc(s.plan)}</td><td>${s.students.toLocaleString('en-IN')}</td><td>${dateFmt(s.renewal)}</td><td>${statusBadge(s.status)}</td><td><button class="link-btn" data-action="toggle-school" data-id="${esc(s.id)}">${s.status==='Active'?'Deactivate':'Activate'}</button></td></tr>`))}

function renderPayments(){return panelTable('Payment history',['Receipt','Student / School','Amount','Mode','Date','Status'],state.payments.map(p=>{const s=state.students.find(x=>x.id===p.studentId);return `<tr><td><b>${esc(p.id)}</b></td><td>${esc(s?.name||p.school||'Subscription payment')}</td><td class="amount">${money(p.amount)}</td><td>${esc(p.mode)}</td><td>${dateFmt(p.date)}</td><td>${statusBadge(p.status)} <button class="link-btn" data-action="receipt" data-id="${esc(p.id)}">Receipt</button></td></tr>`}))}
function renderSupport(){return panelTable('Support tickets',['Ticket','School','Issue','Priority','Status','Action'],state.tickets.map(t=>`<tr><td><b>${esc(t.id)}</b></td><td>${esc(t.school)}</td><td>${esc(t.issue)}</td><td>${statusBadge(t.priority)}</td><td>${statusBadge(t.status)}</td><td><button class="link-btn" data-action="resolve-ticket" data-id="${esc(t.id)}">${t.status==='Resolved'?'Reopen':'Resolve'}</button></td></tr>`))}
function renderStudents(){let rows=state.students.map(s=>`<tr><td><div class="person"><div class="mini-avatar">${initials(s.name)}</div><div><b>${esc(s.name)}</b><div class="subtle">${esc(s.parent)}</div></div></div></td><td>${esc(s.id)}</td><td>${esc(s.klass)}</td><td>${esc(s.phone)}</td><td>${statusBadge(s.attendance)}</td><td class="amount">${money(s.feeDue)}</td><td><button class="link-btn" data-action="edit-student" data-id="${esc(s.id)}">Edit</button></td></tr>`);return panelTable('Student register',['Student / Parent','Admission ID','Class','Parent mobile','Today','Fee due','Action'],rows)}
function renderAttendance(){let list=role==='parent'||role==='student'?childStudents():role==='teacher'?state.students.filter(s=>TEACHER_ASSIGNED_CLASSES.includes(s.klass)):state.students;const editable=role==='school'||role==='teacher';let rows=list.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.id)}</td><td>${esc(s.klass)}</td><td>${editable?`<select class="inline-select attendance-value" data-id="${esc(s.id)}" aria-label="Attendance for ${esc(s.name)}"><option ${s.attendance==='Present'?'selected':''}>Present</option><option ${s.attendance==='Absent'?'selected':''}>Absent</option><option ${s.attendance==='Leave'?'selected':''}>Leave</option></select>`:statusBadge(s.attendance)}</td></tr>`);return `<div class="panel"><div class="panel-head"><div><h3>${editable?'Daily attendance register':'Attendance summary'}</h3><div class="subtle">${dateFmt(TODAY)} · ${list.length} student record(s)</div></div><span class="tag">${editable?'Editable demo register':'Read only'}</span></div><div class="table-wrap"><table><thead><tr><th>Student</th><th>Admission ID</th><th>Class</th><th>Attendance status</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>${editable?`<div class="actions"><button class="primary" data-action="save-attendance">✓ Save attendance</button><span class="subtle">Teacher access is limited to assigned sample classes.</span></div>`:''}</div>`}
function renderFees(){let list=role==='parent'||role==='student'?childStudents():state.students;const ledger=panelTable(role==='parent'?'Child fee ledger':'Student fee ledger',['Student','Admission ID','Class','Fee due','Status','Action'],list.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.id)}</td><td>${esc(s.klass)}</td><td class="amount">${money(s.feeDue)}</td><td>${statusBadge(s.feeDue?'Pending':'Paid')}</td><td>${role==='parent'||role==='school'?`<button class="link-btn" data-action="collect-fee" data-id="${esc(s.id)}" ${s.feeDue<=0?'disabled':''}>Collect / pay</button>`:'<span class="subtle">View only</span>'}</td></tr>`));const ids=list.map(s=>s.id);const history=state.payments.filter(p=>ids.includes(p.studentId));return `${ledger}${panelTable('Payment history',['Receipt','Student','Amount','Mode','Date','Receipt'],history.map(p=>`<tr><td><b>${esc(p.id)}</b></td><td>${esc(state.students.find(s=>s.id===p.studentId)?.name||p.studentId)}</td><td class="amount">${money(p.amount)}</td><td>${esc(p.mode)}</td><td>${dateFmt(p.date)}</td><td><button class="link-btn" data-action="receipt" data-id="${esc(p.id)}">View receipt</button></td></tr>`))}`}

function renderChildResults(){const c=currentChild();const allForChild=state.exams.filter(e=>e.klass===c?.klass);const published=allForChild.filter(e=>e.status==='Published');const resultTable=panelTable('Published results',['Exam','Subject','Student','Marks','Grade','Status'],published.flatMap(e=>Object.entries(e.marks||{}).map(([id,m])=>{const s=state.students.find(x=>x.id===id);if(id!==c?.id)return '';return `<tr><td><b>${esc(e.name)}</b></td><td>${esc(e.subject)}</td><td>${esc(s?.name||id)}</td><td>${m}/100</td><td>${grade(m)}</td><td>${statusBadge('Published')}</td></tr>`})).filter(Boolean));if(role==='student'){const schedule=panelTable('Exam schedule',['Examination','Subject','Date','Status'],allForChild.map(e=>`<tr><td><b>${esc(e.name)}</b></td><td>${esc(e.subject)}</td><td>${dateFmt(e.date)}</td><td>${statusBadge(e.status)}</td></tr>`));return `${schedule}${resultTable}`}return resultTable}

function settingsPage(){return `${pageHead('Settings','Adjust demo school branding and workspace details.')}<div class="notice"><strong>White-label preview:</strong> These settings change only the local demo display. Custom domains and separate mobile app builds are not configured.</div><div class="panel" style="max-width:680px"><form id="settingsForm"><div class="form-grid"><div class="field full"><label>School display name</label><input name="schoolName" value="${esc(state.schoolName)}" required></div><div class="field"><label>Primary brand colour</label><input name="primaryColor" type="color" value="${esc(state.primaryColor)}"></div><div class="field"><label>Preview</label><div class="tag" style="padding:11px;color:${esc(state.primaryColor)}">${esc(state.schoolName)} · ZenX ERP</div></div></div><div class="actions"><button class="primary" type="button" data-action="save-settings">Save branding settings</button><button class="secondary" type="button" data-action="reset-brand">Reset branding</button></div></form></div>`}
function reportsPage(){const due=state.students.reduce((a,s)=>a+s.feeDue,0),present=state.students.filter(s=>s.attendance==='Present').length;return `${pageHead('Reports & analytics','A compact view of academic and fee operations.') }<div class="grid stats">${stat('Students',state.students.length,'♙','Current demo register')}${stat('Present today',present,'✓','Daily register')}${stat('Fee outstanding',money(due),'₹','Across sample students')}${stat('Payments recorded',state.payments.length,'▤','Local demo transactions')}</div><div class="panel"><div class="panel-head"><h3>Report exports</h3><span class="tag">CSV files</span></div><div class="actions"><button class="secondary" data-action="export-students">↓ Student register</button><button class="secondary" data-action="export-payments">↓ Fee collection</button><button class="secondary" data-action="export-attendance">↓ Attendance register</button><button class="secondary" data-action="export-marks">↓ Exam marks</button></div><p class="subtle">Exports are generated on your device from the sample records currently saved in this browser.</p></div>`}
function grade(m){return m>=91?'A1':m>=81?'A2':m>=71?'B1':m>=61?'B2':m>=51?'C1':m>=41?'C2':m>=33?'D':'E'}
function openModal(title,description,fields,submitLabel,submitAction,initial={}){const form=fields.map(f=>{let val=initial[f.name]??f.value??'';if(f.type==='select')return `<div class="field ${f.full?'full':''}"><label for="f_${esc(f.name)}">${esc(f.label)}</label><select id="f_${esc(f.name)}" name="${esc(f.name)}" ${f.required?'required':''}>${f.options.map(o=>`<option value="${esc(typeof o==='string'?o:o.value)}" ${(String(typeof o==='string'?o:o.value)===String(val))?'selected':''}>${esc(typeof o==='string'?o:o.label)}</option>`).join('')}</select></div>`;if(f.type==='textarea')return `<div class="field ${f.full?'full':''}"><label for="f_${esc(f.name)}">${esc(f.label)}</label><textarea id="f_${esc(f.name)}" name="${esc(f.name)}" ${f.required?'required':''}>${esc(val)}</textarea></div>`;return `<div class="field ${f.full?'full':''}"><label for="f_${esc(f.name)}">${esc(f.label)}</label><input id="f_${esc(f.name)}" name="${esc(f.name)}" type="${esc(f.type||'text')}" value="${esc(val)}" ${f.required?'required':''} ${f.min!==undefined?'min="'+f.min+'"':''} ${f.max!==undefined?'max="'+f.max+'"':''} ${f.step?'step="'+f.step+'"':''} ${f.placeholder?'placeholder="'+esc(f.placeholder)+'"':''}></div>`}).join('');document.getElementById('modal').innerHTML=`<h2 id="modalTitle">${esc(title)}</h2><p class="modal-desc">${esc(description)}</p><form id="modalForm" data-submit="${esc(submitAction)}"><div class="form-grid">${form}</div><div class="modal-actions"><button class="secondary" type="button" data-action="close-modal">Cancel</button><button class="primary" type="button" data-action="submit-modal">${esc(submitLabel)}</button></div></form>`;document.getElementById('modalBackdrop').classList.add('show');document.querySelector('#modalForm input,#modalForm select,#modalForm textarea')?.focus()}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3000)}
function addStudent(){openModal('New student admission','Create a student record in the local demo register.',[{name:'name',label:'Student full name',required:true,placeholder:'e.g. Riya Sharma'},{name:'klass',label:'Class & section',type:'select',options:['Class 6-A','Class 7-B','Class 8-A','Class 8-B','Class 9-A']},{name:'id',label:'Admission number',required:true,placeholder:'e.g. ZX2026007'},{name:'phone',label:'Parent mobile',type:'tel',required:true,placeholder:'10-digit number'},{name:'parent',label:'Parent / guardian name',full:true,required:true}], 'Save student','save-student')}
function addSchool(){openModal('Register a school','Add a sample tenant to the ZenX platform.',[{name:'name',label:'School name',full:true,required:true},{name:'plan',label:'Subscription plan',type:'select',options:['Starter','Pro School','Enterprise']},{name:'students',label:'Student capacity',type:'number',value:300,min:1},{name:'renewal',label:'Renewal date',type:'date',value:'2026-12-31'}],'Create school','save-school')}
function collectFee(id){const s=state.students.find(x=>x.id===id)||state.students.find(x=>x.feeDue>0)||state.students[0];if(!s){notify('No student found.');return}if(Number(s.feeDue)<=0){notify('This student has no outstanding fee balance.');return}openModal('Record fee payment','Simulated transaction only. No money will be collected.',[{name:'studentId',label:'Student',type:'select',options:state.students.map(x=>({value:x.id,label:x.name+' · '+x.id})),value:s.id,full:true},{name:'amount',label:'Amount (₹)',type:'number',value:s.feeDue||1200,min:1},{name:'mode',label:'Payment mode',type:'select',options:['UPI','Cash','Bank transfer','Card']},{name:'ref',label:'Transaction reference',full:true,placeholder:'Demo reference (optional)'}],'Record payment','save-payment')}
function addHomework(){const classOptions=[...new Set(state.classes.map(c=>c.name+'-'+c.section).filter(c=>role!=='teacher'||TEACHER_ASSIGNED_CLASSES.includes(c)))];openModal('Create homework','Assign a task to a class. Students can mark it submitted in their portal.',[{name:'title',label:'Assignment title',required:true,full:true},{name:'klass',label:'Class',type:'select',options:classOptions},{name:'subject',label:'Subject',required:true,value:'Mathematics'},{name:'due',label:'Due date',type:'date',value:'2026-11-21'},{name:'description',label:'Instructions',type:'textarea',full:true}], 'Publish homework','save-homework')}
function addExam(){openModal('Create examination','Create an assessment in the sample examination calendar.',[{name:'name',label:'Exam name',required:true,full:true},{name:'klass',label:'Class',type:'select',options:[...new Set(state.classes.map(c=>c.name+'-'+c.section))]},{name:'subject',label:'Subject',required:true,value:'Mathematics'},{name:'date',label:'Exam date',type:'date',value:'2026-12-01'}],'Create exam','save-exam')}
function enterMarks(id){const assignedExams=state.exams.filter(x=>role!=='teacher'||TEACHER_ASSIGNED_CLASSES.includes(x.klass));let s=state.students.find(x=>x.id===id);let e=s?assignedExams.find(x=>x.klass===s.klass):assignedExams[0];if(!e){notify('No examination is configured for this class yet. Ask the School Admin to add one.');return}const classExams=assignedExams.filter(x=>x.klass===e.klass);const classStudents=state.students.filter(x=>x.klass===e.klass);s=classStudents.find(x=>x.id===id)||classStudents[0];openModal('Enter examination marks','Only students in the selected examination class are listed.',[{name:'examId',label:'Examination',type:'select',options:classExams.map(x=>({value:x.id,label:x.name+' · '+x.klass})),value:e.id,full:true},{name:'studentId',label:'Student',type:'select',options:classStudents.map(x=>({value:x.id,label:x.name+' · '+x.klass})),value:s?.id,full:true},{name:'marks',label:'Marks out of 100',type:'number',value:75,min:0,max:100}], 'Save marks','save-marks')}
function addNotice(){openModal('Publish a notice','Create a sample school circular.',[{name:'title',label:'Notice title',required:true,full:true},{name:'audience',label:'Audience',type:'select',options:['All classes','Teachers','Parents','Class 6-A','Class 8-A']},{name:'date',label:'Publish date',type:'date',value:TODAY},{name:'body',label:'Message',type:'textarea',full:true,required:true}], 'Publish notice','save-notice')}
function addStaff(){openModal('Add staff member','Create a sample employee record.',[{name:'name',label:'Employee name',required:true,full:true},{name:'id',label:'Employee ID',required:true},{name:'department',label:'Department',type:'select',options:['Mathematics','English','Science','Administration','Accounts','Transport']},{name:'type',label:'Employment type',type:'select',options:['Full time','Part time','Contract'] }],'Save staff','save-staff')}
function addClass(){openModal('Add class section','Create a teaching group for this school.',[{name:'name',label:'Class',type:'select',options:['Class 1','Class 2','Class 3','Class 4','Class 5','Class 6','Class 7','Class 8','Class 9','Class 10','Class 11','Class 12']},{name:'section',label:'Section',required:true,value:'A'},{name:'count',label:'Student count',type:'number',value:0,min:0},{name:'teacher',label:'Class teacher',required:true}], 'Save class','save-class')}
function applyLeave(){openModal('Apply for leave','Submit a sample leave request for review.',[{name:'type',label:'Leave type',type:'select',options:['Casual leave','Sick leave','Earned leave']},{name:'from',label:'From date',type:'date',value:'2026-11-20'},{name:'days',label:'Number of days',type:'number',value:1,min:1},{name:'reason',label:'Reason',type:'textarea',full:true}], 'Submit request','save-leave')}
function addTicket(){openModal('Create support ticket','Log a sample school support request for the ZenX team.',[{name:'school',label:'School',type:'select',options:state.schools.map(s=>s.name),full:true},{name:'issue',label:'Issue summary',required:true,full:true},{name:'priority',label:'Priority',type:'select',options:['Low','Normal','High','Urgent']}], 'Create ticket','save-ticket')}
function saveForm(action,data){
 if(action==='save-student'){if(state.students.some(s=>s.id.toLowerCase()===data.id.toLowerCase()))return notify('Admission number already exists. Choose a unique ID.');if(!/^\d{10}$/.test(data.phone))return notify('Enter a valid 10-digit parent mobile number.');state.students.unshift({id:data.id,name:data.name,klass:data.klass,parent:data.parent,phone:data.phone,attendance:'Present',feeDue:0});notify('Student admitted successfully in this demo.');go('Students');}
 else if(action==='save-school'){state.schools.push({id:'SCH-'+String(Date.now()).slice(-5),name:data.name,plan:data.plan,students:Number(data.students),renewal:data.renewal,status:'Active'});notify('School tenant added to demo.');go('Schools');}
 else if(action==='save-payment'){const s=state.students.find(x=>x.id===data.studentId),amount=Number(data.amount);if(!s||!Number.isFinite(amount)||amount<=0)return notify('Enter a valid payment amount.');if(amount>s.feeDue&&s.feeDue>0)return notify('Payment cannot exceed the outstanding fee in this demo.');s.feeDue=Math.max(0,s.feeDue-amount);const payment={id:'PAY-'+String(Date.now()).slice(-6),studentId:s.id,amount,mode:data.mode,date:TODAY,status:'Paid',ref:data.ref||'DEMO-'+String(Date.now()).slice(-5)};state.payments.unshift(payment);notify('Demo payment saved. No real transaction occurred.');go(role==='super'?'Payments':'Fees');}
 else if(action==='save-homework'){if(role==='teacher'&&!TEACHER_ASSIGNED_CLASSES.includes(data.klass))return notify('You can assign homework only to your assigned classes.');state.homework.unshift({id:'HW-'+String(Date.now()).slice(-5),title:data.title,klass:data.klass,subject:data.subject,due:data.due,description:data.description,createdBy:role==='teacher'?'Ms. Mehta':'School Admin',submittedBy:[]});notify('Homework published in the local demo.');go('Homework');}
 else if(action==='save-exam'){let klass=data.klass.replace('-', ' ');state.exams.unshift({id:'EX-'+String(Date.now()).slice(-5),name:data.name,klass:data.klass,subject:data.subject,date:data.date,status:'Scheduled',marks:{}});notify('Examination added to the demo calendar.');go('Exams');}
 else if(action==='save-marks'){let e=state.exams.find(x=>x.id===data.examId),student=state.students.find(x=>x.id===data.studentId),m=Number(data.marks);if(!e||!Number.isFinite(m)||m<0||m>100)return notify('Marks must be between 0 and 100.');if(!student||student.klass!==e.klass||(role==='teacher'&&!TEACHER_ASSIGNED_CLASSES.includes(e.klass)))return notify('You can enter marks only for students in your assigned classes.');e.marks[data.studentId]=m;e.status='Published';notify('Marks saved. Grade: '+grade(m));go(role==='teacher'?'Marks':'Results');}
 else if(action==='save-notice'){state.notices.unshift({id:'NT-'+String(Date.now()).slice(-5),title:data.title,audience:data.audience,date:data.date,body:data.body});notify('Notice published in the demo.');go('Notices');}
 else if(action==='save-staff'){if(state.staff.some(s=>s.id===data.id))return notify('Employee ID already exists.');state.staff.unshift({...data,status:'Active'});notify('Staff member added.');go('Staff');}
 else if(action==='save-class'){if(state.classes.some(c=>c.name===data.name&&c.section===data.section))return notify('This class section already exists.');state.classes.push({...data,count:Number(data.count)});notify('Class section created.');go('Classes');}
 else if(action==='save-ticket'){state.tickets.unshift({id:'TKT-'+String(Date.now()).slice(-5),school:data.school,issue:data.issue,priority:data.priority,status:'Open'});notify('Support ticket created.');go('Support');}
 else if(action==='save-leave'){state.leave.unshift({id:'LV-'+String(Date.now()).slice(-5),person:'Ms. Mehta',type:data.type,from:data.from,days:Number(data.days),status:'Pending'});notify('Leave request submitted.');go('Leave');}
 else if(action==='save-settings'){state.schoolName=data.schoolName;state.primaryColor=data.primaryColor;notify('Branding settings saved locally.');render();}
 saveState();
}
function exportCSV(filename,rows){const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);notify(filename+' downloaded.');}
function exportCurrent(){if(page==='Students')return exportStudents();if(page==='Schools')return exportCSV('zenx-schools.csv',[['School','Plan','Students','Renewal','Status'],...state.schools.map(s=>[s.name,s.plan,s.students,s.renewal,s.status])]);if(page==='Payments')return exportPayments();if(page==='Attendance')return exportAttendance();if(page==='Homework')return exportCSV('zenx-homework.csv',[['Title','Class','Subject','Due date','Submissions'],...state.homework.map(h=>[h.title,h.klass,h.subject,h.due,h.submittedBy.length])]);if(page==='Notices')return exportCSV('zenx-notices.csv',[['Title','Audience','Date','Message'],...state.notices.map(n=>[n.title,n.audience,n.date,n.body])]);if(page==='Staff')return exportCSV('zenx-staff.csv',[['Employee','ID','Department','Type','Status'],...state.staff.map(s=>[s.name,s.id,s.department,s.type,s.status])]);if(page==='Classes')return exportCSV('zenx-classes.csv',[['Class','Section','Students','Teacher'],...state.classes.map(c=>[c.name,c.section,c.count,c.teacher])]);if(page==='Exams'||page==='Results'||page==='Exams & Results')return exportMarks();if(page==='Subscriptions')return exportCSV('zenx-subscriptions.csv',[['School','Plan','Students','Renewal','Status'],...state.schools.map(s=>[s.name,s.plan,s.students,s.renewal,s.status])]);if(page==='Support')return exportCSV('zenx-support.csv',[['Ticket','School','Issue','Priority','Status'],...state.tickets.map(t=>[t.id,t.school,t.issue,t.priority,t.status])]);notify('CSV export is available for this module in the next release.');}
function exportStudents(){exportCSV('zenx-students.csv',[['Name','Admission ID','Class','Parent','Mobile','Attendance','Fee due'],...state.students.map(s=>[s.name,s.id,s.klass,s.parent,s.phone,s.attendance,s.feeDue])])}
function exportPayments(){exportCSV('zenx-fee-payments.csv',[['Receipt','Student ID','Student','Amount','Mode','Date','Status','Reference'],...state.payments.map(p=>[p.id,p.studentId,state.students.find(s=>s.id===p.studentId)?.name||'',p.amount,p.mode,p.date,p.status,p.ref])])}
function exportAttendance(){exportCSV('zenx-attendance.csv',[['Admission ID','Student','Class','Attendance'],...state.students.map(s=>[s.id,s.name,s.klass,s.attendance])])}
function exportMarks(){exportCSV('zenx-exam-marks.csv',[['Exam','Class','Subject','Student','Marks','Grade'],...state.exams.flatMap(e=>Object.entries(e.marks).map(([id,m])=>[e.name,e.klass,e.subject,state.students.find(s=>s.id===id)?.name||id,m,grade(m)]))])}
function downloadReceipt(id){const p=state.payments.find(x=>x.id===id);if(!p)return;const s=state.students.find(x=>x.id===p.studentId);const html=`<!doctype html><html><head><meta charset="utf-8"><title>Fee receipt ${esc(p.id)}</title><style>body{font-family:Arial;margin:40px;color:#17233d}.box{max-width:620px;margin:auto;border:1px solid #ccd5e3;padding:28px}.muted{color:#66758d}.line{border-top:1px solid #ddd;margin:18px 0}h1{font-size:22px}td{padding:10px 16px 10px 0}</style></head><body><div class="box"><h1>${esc(state.schoolName)}</h1><p class="muted">Fee payment receipt · Demo copy</p><div class="line"></div><table><tr><td>Receipt No.</td><td><b>${esc(p.id)}</b></td></tr><tr><td>Student</td><td>${esc(s?.name||'')}</td></tr><tr><td>Admission ID</td><td>${esc(p.studentId)}</td></tr><tr><td>Payment date</td><td>${dateFmt(p.date)}</td></tr><tr><td>Payment mode</td><td>${esc(p.mode)}</td></tr><tr><td>Reference</td><td>${esc(p.ref)}</td></tr><tr><td>Amount received</td><td><b>${money(p.amount)}</b></td></tr></table><div class="line"></div><p class="muted">This is a sample receipt generated by the ZenX School ERP demo. It is not proof of a real payment.</p><button onclick="window.print()">Print / Save PDF</button></div></body></html>`;const w=window.open('','_blank');if(!w){notify('Allow pop-ups to open the printable receipt.');return}w.document.write(html);w.document.close()}
function resetDemo(){if(!confirm('Reset all local demo changes and restore sample data?'))return;state=defaultState();saveState();role='super';page='Overview';render();notify('Demo data restored to the original sample.');}
function importCSV(){const input=document.createElement('input');input.type='file';input.accept='.csv,text/csv';input.onchange=()=>{const file=input.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const lines=String(reader.result).split(/\r?\n/).filter(Boolean);let added=0,errors=0;for(const line of lines.slice(1)){const cols=parseCSVLine(line);if(cols.length<4){errors++;continue}const [name,id,klass,parent,phone]=cols;if(!name||!id||state.students.some(s=>s.id===id)||!/^\d{10}$/.test(phone||'')){errors++;continue}state.students.push({name,id,klass,parent,phone,attendance:'Present',feeDue:0});added++}saveState();render();notify(`Import complete: ${added} added, ${errors} skipped. Check required columns.`)};reader.readAsText(file)};input.click()}
function parseCSVLine(line){const out=[];let cur='',quoted=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&line[i+1]==='"'&&quoted){cur+='"';i++}else if(c==='"'){quoted=!quoted}else if(c===','&&!quoted){out.push(cur.trim());cur=''}else cur+=c}out.push(cur.trim());return out}
function handleAction(action,target){
 if(action==='toggle-menu'){document.getElementById('sidebar').classList.toggle('open');document.getElementById('mobileOverlay').classList.toggle('show');return}
 if(action==='close-menu'){document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileOverlay').classList.remove('show');return}
 if(action==='close-modal'){closeModal();return}
 if(action==='submit-modal'){const f=document.getElementById('modalForm');if(f)handleFormSubmit(f);return}
 if(action==='reset-demo'){resetDemo();return}
 if(action==='add-student'){addStudent();return}if(action==='add-school'){addSchool();return}if(action==='add-ticket'){addTicket();return}if(action==='collect-fee'){collectFee(target.dataset.id);return}if(action==='add-homework'){addHomework();return}if(action==='add-exam'){addExam();return}if(action==='enter-marks'||action==='mark-student'){enterMarks(target.dataset.id);return}if(action==='add-notice'){addNotice();return}if(action==='add-staff'){addStaff();return}if(action==='add-class'){addClass();return}if(action==='apply-leave'){applyLeave();return}
 if(action==='save-attendance'){const list=state.students;list.forEach(s=>{if(attendanceDraft[s.id])s.attendance=attendanceDraft[s.id]});state.attendanceLog.unshift({date:TODAY,updated:list.length});saveState();attendanceDraft={};notify('Attendance saved successfully in the local demo.');render();return}
 if(action==='toggle-school'){const s=state.schools.find(x=>x.id===target.dataset.id);if(s){s.status=s.status==='Active'?'Inactive':'Active';saveState();render();notify(`${s.name} is now ${s.status.toLowerCase()}.`)}return}
 if(action==='edit-plan'){const s=state.schools.find(x=>x.id===target.dataset.id);if(!s)return;openModal('Change subscription plan','Update the sample school plan.',[{name:'plan',label:'Subscription plan',type:'select',options:['Starter','Pro School','Enterprise'],value:s.plan}], 'Save plan','update-plan',{schoolId:s.id});return}
 if(action==='resolve-ticket'){const t=state.tickets.find(x=>x.id===target.dataset.id);if(t){t.status=t.status==='Resolved'?'Open':'Resolved';saveState();render();notify('Ticket status updated.')}return}
 if(action==='exam-status'){const e=state.exams.find(x=>x.id===target.dataset.id);if(e){e.status=e.status==='Published'?'Draft':'Published';saveState();render();notify('Exam status updated.')}return}
 if(action==='submit-homework'){const h=state.homework.find(x=>x.id===target.dataset.id),c=currentChild();if(h&&c&&!h.submittedBy.includes(c.id)){h.submittedBy.push(c.id);saveState();render();notify('Assignment marked as submitted.')}return}
 if(action==='receipt'){downloadReceipt(target.dataset.id);return}
 if(action==='edit-student'){const s=state.students.find(x=>x.id===target.dataset.id);if(!s)return;openModal('Edit student','Update the local sample student profile.',[{name:'name',label:'Student name',required:true,value:s.name},{name:'klass',label:'Class & section',type:'select',options:['Class 6-A','Class 7-B','Class 8-A','Class 8-B','Class 9-A'],value:s.klass},{name:'parent',label:'Parent name',full:true,value:s.parent},{name:'phone',label:'Parent mobile',required:true,value:s.phone},{name:'feeDue',label:'Fee due (₹)',type:'number',min:0,value:s.feeDue}], 'Save changes','update-student',{studentId:s.id});return}
 if(action==='edit-class'){const c=state.classes[Number(target.dataset.index)];if(!c)return;openModal('Edit class section','Update class teacher and student count.',[{name:'teacher',label:'Class teacher',value:c.teacher,required:true},{name:'count',label:'Student count',type:'number',value:c.count,min:0}], 'Save changes','update-class',{index:Number(target.dataset.index)});return}
 if(action==='reset-brand'){state.schoolName='Zenith Public School';state.primaryColor='#326ff2';saveState();render();notify('Branding reset.');return}
 if(action==='save-settings'){const f=document.getElementById('settingsForm');if(!f)return;const d=Object.fromEntries(new FormData(f).entries());if(!d.schoolName.trim())return notify('School display name is required.');state.schoolName=d.schoolName.trim();state.primaryColor=d.primaryColor||'#326ff2';saveState();render();notify('Branding settings saved locally.');return}
 if(action==='export-table'){exportCurrent();return}if(action==='export-report'){exportCSV('zenx-demo-overview.csv',[['Metric','Value'],['Students',state.students.length],['Present today',state.students.filter(s=>s.attendance==='Present').length],['Fees outstanding',state.students.reduce((a,s)=>a+s.feeDue,0)],['Recorded payments',state.payments.length]]);return}
 if(action==='export-students'){exportStudents();return}if(action==='export-payments'){exportPayments();return}if(action==='export-attendance'){exportAttendance();return}if(action==='export-marks'){exportMarks();return}
 if(action==='import-csv'){importCSV();return}
 if(action==='quick-main'){if(role==='super')addSchool();else if(role==='school')addStudent();else if(role==='teacher')addHomework();else if(role==='parent')collectFee(currentChild()?.id);else go('Homework');return}
 }
function handleFormSubmit(form){const action=form.dataset.submit;const data=Object.fromEntries(new FormData(form).entries());
 if(action==='save-student'){if(!data.name.trim()||!data.id.trim()||!data.parent.trim())return notify('Complete the student name, admission ID and parent name.');if(!/^\d{10}$/.test(data.phone))return notify('Enter a valid 10-digit parent mobile number.');if(state.students.some(s=>s.id.toLowerCase()===data.id.toLowerCase()))return notify('Admission number already exists. Choose a unique ID.')}
 if(action==='update-student'&&!/^\d{10}$/.test(data.phone))return notify('Enter a valid 10-digit parent mobile number.');
 if(action==='save-school'&&(!data.name.trim()||Number(data.students)<1))return notify('Enter a school name and a student capacity above zero.');
 if(action==='save-payment'){const student=state.students.find(s=>s.id===data.studentId),amount=Number(data.amount);if(!student||!Number.isFinite(amount)||amount<=0||amount>student.feeDue)return notify('Enter a valid payment up to the outstanding fee amount.')}
 if(action==='save-homework'&&(!data.title.trim()||!data.subject.trim()||!data.due))return notify('Enter the assignment title, subject and due date.');
 if(action==='save-exam'&&(!data.name.trim()||!data.subject.trim()||!data.date))return notify('Enter the exam name, subject and date.');
 if(action==='save-marks'&&(!Number.isFinite(Number(data.marks))||Number(data.marks)<0||Number(data.marks)>100))return notify('Marks must be between 0 and 100.');
 if(action==='save-notice'&&(!data.title.trim()||!data.body.trim()))return notify('Enter a notice title and message.');
 if(action==='save-staff'&&(!data.name.trim()||!data.id.trim()||state.staff.some(s=>s.id===data.id)))return notify('Enter a staff name and unique employee ID.');
 if(action==='save-class'&&(!data.teacher.trim()||Number(data.count)<0||state.classes.some(c=>c.name===data.name&&c.section===data.section)))return notify('Enter a valid class teacher and a unique class section.');
 if(action==='save-leave'&&(!Number.isInteger(Number(data.days))||Number(data.days)<1))return notify('Leave duration must be at least one day.');
 if(action==='save-ticket'&&!data.issue.trim())return notify('Enter a short support issue summary.');
 if(action==='update-plan'){const id=form.dataset.schoolId;const s=state.schools.find(x=>x.id===id);if(s){s.plan=data.plan;closeModal();saveState();go('Subscriptions');notify('Subscription plan updated.')}return}
 if(action==='update-student'){const id=form.dataset.studentId,s=state.students.find(x=>x.id===id);if(s){if(!/^\d{10}$/.test(data.phone))return notify('Enter a valid 10-digit parent mobile.');Object.assign(s,{name:data.name,klass:data.klass,parent:data.parent,phone:data.phone,feeDue:Number(data.feeDue)});closeModal();saveState();go('Students');notify('Student profile updated.')}return}
 if(action==='update-class'){const c=state.classes[Number(form.dataset.index)];if(c){c.teacher=data.teacher;c.count=Number(data.count);closeModal();saveState();go('Classes');notify('Class details updated.')}return}
 if(action==='save-settings'){state.schoolName=data.schoolName;state.primaryColor=data.primaryColor;closeModal();saveState();render();notify('Branding settings saved locally.');return}
 closeModal();saveForm(action,data)}
// Event delegation keeps the prototype's controls connected after each screen render.
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){go(nav.dataset.nav);return}const quick=e.target.closest('[data-quick]');if(quick){runQuick(quick.dataset.quick);return}const action=e.target.closest('[data-action]');if(action)handleAction(action.dataset.action,action)});

document.addEventListener('input',e=>{if(e.target.id==='tableSearch'){searchTerm=e.target.value.toLowerCase();const table=document.querySelector('.table-panel table');if(table)table.querySelectorAll('tbody tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(searchTerm)?'':'none')}});
document.addEventListener('change',e=>{if(e.target.id==='roleSelect'){switchRole(e.target.value);return}if(e.target.id==='childSelect'){state.selectedChildId=e.target.value;saveState();render();return}if(e.target.classList.contains('attendance-value'))attendanceDraft[e.target.dataset.id]=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function runQuick(title){const map={'New admission':()=>addStudent(),'Add student':()=>addStudent(),'Mark attendance':()=>go('Attendance'),'Collect fee':()=>collectFee(),'Pay fees':()=>collectFee(currentChild()?.id),'Create homework':()=>addHomework(),'Add homework':()=>addHomework(),'Enter marks':()=>enterMarks(),'View timetable':()=>go('Timetable'),'Subscriptions':()=>go('Subscriptions'),'Payments':()=>go('Payments'),'Support':()=>go('Support'),'Support tickets':()=>go('Support'),'Results':()=>go(role==='student'?'Exams & Results':'Results'),'View results':()=>go(role==='student'?'Exams & Results':'Results'),'Homework':()=>go('Homework'),'Attendance':()=>go('Attendance'),'Notices':()=>go('Notices'),'School notices':()=>go('Notices'),'Exam schedule':()=>go('Exams & Results'),'Fees':()=>go('Fees'),'Students':()=>go('Students'),'Contact school':()=>go('Notices'),'Add school':()=>addSchool()};(map[title]||(()=>notify('Choose a module from the navigation.')))()}
// Form metadata is attached here so modal submissions remain independent from rendered markup.
const oldOpenModal=openModal;
openModal=function(title,description,fields,submitLabel,submitAction,initial={}){oldOpenModal(title,description,fields,submitLabel,submitAction,initial);const f=document.getElementById('modalForm');if(f){if(submitAction==='update-plan')f.dataset.schoolId=initial.schoolId;if(submitAction==='update-student')f.dataset.studentId=initial.studentId;if(submitAction==='update-class')f.dataset.index=String(initial.index)}};
function renderBoot(){render();}
// Make selected flows and test hooks available to the local browser demo.
window.ZenXDemo={getState:()=>JSON.parse(JSON.stringify(state)),switchRole,go,reset:()=>{state=defaultState();saveState();render()},render,exportStudents,exportPayments,exportAttendance};
renderBoot();
</script>
